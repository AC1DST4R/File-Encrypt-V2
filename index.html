<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AES File Encoder / Decoder</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08090c;
    --panel: #101217;
    --panel-2: #151820;
    --border: #262a33;
    --border-hover: #3a404d;
    --text: #f2f4f7;
    --muted: #8e96a3;
    --accent: #ffffff;
    --accent-text: #090a0c;
    --track: #242832;
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background:
      radial-gradient(circle at 50% -20%, #1b1f29 0, transparent 42%),
      var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  button,
  input {
    font: inherit;
  }

  .app {
    width: min(760px, 100%);
  }

  .app > h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.1;
    letter-spacing: -1.5px;
    font-weight: 750;
  }

  .sub {
    margin: 9px 0 28px;
    color: var(--muted);
    font-size: 15px;
  }

  .tabs {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
  }

  button {
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 10px 15px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }

  button:hover {
    color: var(--text);
    background: var(--panel-2);
  }

  button.active {
    background: #e9ebee;
    color: #0a0b0e;
  }

  .panel {
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(16, 18, 23, .94);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
  }

  .drop {
    display: block;
    padding: 30px 20px;
    margin-bottom: 12px;
    text-align: center;
    border: 1px dashed #343945;
    border-radius: 12px;
    background: #0d0f14;
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }

  .drop:hover {
    border-color: var(--border-hover);
    background: #12151b;
  }

  .drop strong {
    display: block;
    margin-bottom: 5px;
    font-size: 15px;
  }

  .drop small {
    color: var(--muted);
    font-size: 13px;
  }

  input[type="file"] {
    display: none;
  }

  .actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .actions button {
    border-color: var(--border);
    background: var(--panel-2);
    color: var(--text);
  }

  .actions button:hover {
    border-color: var(--border-hover);
  }

  .actions .primary {
    border-color: transparent;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 650;
  }

  .actions .primary:hover {
    background: #dfe2e6;
  }

  .status {
    min-height: 52px;
    margin-top: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0d0f13;
    color: #b5bcc7;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .progress-wrap {
    margin-top: 10px;
    padding: 13px 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0d0f13;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 9px;
    color: var(--muted);
    font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--track);
  }

  .progress-bar {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: #e9ebee;
    transition: width .08s linear;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 560px) {
    body {
      padding: 28px 14px;
    }

    .panel {
      padding: 14px;
    }

    .drop {
      padding: 25px 14px;
    }

    .actions button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="app">
  <h1>AES File Encoder / Decoder</h1>
  <div class="sub">Custom <strong>.aes</strong> files and <strong>.aesbnk</strong> folder bundles</div>

  <div class="tabs">
    <button id="encTab" class="active">Encode</button>
    <button id="decTab">Decode</button>
  </div>

  <section id="encodePanel" class="panel">
    <label class="drop" for="encodeFiles">
      <strong>Choose files</strong><br>
      <small>You can select one or many files.</small>
    </label>
    <input id="encodeFiles" type="file" multiple>
    <label class="drop" for="encodeFolder">
      <strong>Choose an entire folder</strong><br>
      <small>The folder's relative structure will be preserved in one .aesbnk.</small>
    </label>
    <input id="encodeFolder" type="file" webkitdirectory directory multiple>
    <div class="actions">
      <button class="primary" id="encodeBtn">Encode selected files</button>
      <button id="folderBtn">Encode selected folder</button>
    </div>
  </section>

  <section id="decodePanel" class="panel hidden">
    <label class="drop" for="decodeFiles">
      <strong>Choose .aes or .aesbnk files</strong><br>
      <small>.aes restores one file; .aesbnk restores all files in a bundle.</small>
    </label>
    <input id="decodeFiles" type="file" multiple accept=".aes,.aesbnk">
    <div class="actions">
      <button class="primary" id="decodeBtn">Decode</button>
    </div>
  </section>

  <div id="status" class="status">Ready.</div>
  <div id="progressWrap" class="progress-wrap hidden">
    <div class="progress-label">
      <span id="progressText">Preparing...</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>

</div>

<script>
"use strict";

/*
  AES format:
    .aes   = text containing uppercase hexadecimal characters.
    .aesbnk = JSON container:
      {
        "format": "AESBNK1",
        "files": [
          {"path": "relative/name.ext", "data": "<hex string>"}
        ]
      }

  For arbitrary binary files, Caesar is applied to every byte modulo 256:
    encodedByte = (originalByte - 8 + 256) % 256
  Decode:
    originalByte = (encodedByte + 8) % 256
*/

const $ = id => document.getElementById(id);
const status = msg => $("status").textContent = msg;

function bytesToBase64(bytes) {
  let binary = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

function base64ToBytes(str) {
  const binary = atob(str);
  const out = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
}

function bytesToHex(bytes) {
  let out = "";
  for (const b of bytes) out += b.toString(16).padStart(2, "0");
  return out.toUpperCase();
}

function hexToBytes(hex) {
  hex = hex.trim();
  if (hex.length % 2) throw new Error("Invalid Base16: odd number of hex characters.");
  if (!/^[0-9a-fA-F]*$/.test(hex)) throw new Error("Invalid Base16 data.");
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.slice(i*2, i*2+2), 16);
  return out;
}

function caesarLeft8(bytes) {
  const out = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) out[i] = (bytes[i] + 256 - 8) & 255;
  return out;
}

function caesarRight8(bytes) {
  const out = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) out[i] = (bytes[i] + 8) & 255;
  return out;
}

function encodeBytes(bytes) {
  return bytesToHex(new TextEncoder().encode(bytesToBase64(caesarLeft8(bytes))));
}

function decodeBytes(hex) {
  const base64 = new TextDecoder().decode(hexToBytes(hex));
  return caesarRight8(base64ToBytes(base64));
}

function safeName(name) {
  return name.replace(/[<>:"/\\\\|?*\\x00-\\x1F]/g, "_").replace(/^\\.+$/, "_");
}

async function downloadBlob(blob, filename, label = filename) {
  const progressWrap = $("progressWrap");
  const progressBar = $("progressBar");
  const progressText = $("progressText");
  const progressPercent = $("progressPercent");

  progressWrap.classList.remove("hidden");
  progressBar.style.width = "0%";
  progressText.textContent = "Preparing " + label + "...";
  progressPercent.textContent = "0%";

  // Browser downloads themselves do not expose reliable download progress.
  // This progress bar tracks preparation/write of the generated download data.
  const total = blob.size || 1;
  let processed = 0;
  const chunkSize = 1024 * 1024;

  for (let offset = 0; offset < total; offset += chunkSize) {
    processed = Math.min(offset + chunkSize, total);
    const pct = Math.round((processed / total) * 100);
    progressBar.style.width = pct + "%";
    progressPercent.textContent = pct + "%";
    progressText.textContent = "Preparing " + label + "...";
    await new Promise(requestAnimationFrame);
  }

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  progressText.textContent = "Starting download...";
  a.click();

  progressBar.style.width = "100%";
  progressPercent.textContent = "100%";
  progressText.textContent = "Download started: " + label;

  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1500);
}

async function encodeSingle(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const hex = encodeBytes(bytes);
  await downloadBlob(new Blob([hex], {type:"text/plain"}), file.name + ".aes", file.name + ".aes");
}

async function encodeBundle(files) {
  const entries = [];
  for (const file of files) {
    const path = file.webkitRelativePath || file.name;
    entries.push({
      path,
      data: encodeBytes(new Uint8Array(await file.arrayBuffer()))
    });
  }
  const bundle = {
    format: "AESBNK1",
    version: 1,
    files: entries
  };
  const json = JSON.stringify(bundle);
  const base = (files[0]?.webkitRelativePath || "folder").split("/")[0] || "folder";
  await downloadBlob(new Blob([json], {type:"application/json"}), safeName(base) + ".aesbnk", safeName(base) + ".aesbnk");
}

async function decodeAES(file) {
  const hex = await file.text();
  const bytes = decodeBytes(hex);
  const original = file.name.replace(/\\.aes$/i, "") || "decoded";
  await downloadBlob(new Blob([bytes]), safeName(original), safeName(original));
}

async function decodeBundle(file) {
  const bundle = JSON.parse(await file.text());
  if (bundle.format !== "AESBNK1" || !Array.isArray(bundle.files))
    throw new Error("Not a valid AESBNK1 bundle.");

  /*
    Browsers cannot silently create an arbitrary folder tree in a download.
    Each restored file is therefore downloaded individually. The path is
    shown in the filename when necessary.
  */
  for (const entry of bundle.files) {
    if (!entry || typeof entry.path !== "string" || typeof entry.data !== "string") continue;
    const bytes = decodeBytes(entry.data);
    const normalized = entry.path.replace(/^[/\\\\]+/, "").replace(/\\.\\.(?=[/\\\\])/g, "_");
    const parts = normalized.split(/[\\/]/).filter(Boolean).map(safeName);
    const filename = parts.length > 1 ? parts.join("__") : (parts[0] || "decoded");
    await downloadBlob(new Blob([bytes]), filename, entry.path);
    await new Promise(r => setTimeout(r, 80));
  }
}

$("encTab").onclick = () => {
  $("encTab").classList.add("active"); $("decTab").classList.remove("active");
  $("encodePanel").classList.remove("hidden"); $("decodePanel").classList.add("hidden");
  status("Ready to encode.");
};
$("decTab").onclick = () => {
  $("decTab").classList.add("active"); $("encTab").classList.remove("active");
  $("decodePanel").classList.remove("hidden"); $("encodePanel").classList.add("hidden");
  status("Ready to decode.");
};

$("encodeBtn").onclick = async () => {
  const files = [...$("encodeFiles").files];
  if (!files.length) return status("Select at least one file.");
  try {
    if (files.length === 1) {
      status("Encoding " + files[0].name + "...");
      await encodeSingle(files[0]);
      status("Done: " + files[0].name + ".aes");
    } else {
      status("Encoding " + files.length + " files into an .aesbnk...");
      await encodeBundle(files);
      status("Done: .aesbnk bundle created.");
    }
  } catch (e) { status("ERROR: " + e.message); }
};

$("folderBtn").onclick = async () => {
  const files = [...$("encodeFolder").files];
  if (!files.length) return status("Select a folder first.");
  try {
    status("Encoding folder (" + files.length + " files)...");
    await encodeBundle(files);
    status("Done: folder encoded as .aesbnk.");
  } catch (e) { status("ERROR: " + e.message); }
};

$("decodeBtn").onclick = async () => {
  const files = [...$("decodeFiles").files];
  if (!files.length) return status("Select .aes or .aesbnk files.");
  try {
    for (const file of files) {
      status("Decoding " + file.name + "...");
      if (/\\.aesbnk$/i.test(file.name)) await decodeBundle(file);
      else if (/\\.aes$/i.test(file.name)) await decodeAES(file);
      else throw new Error(file.name + " is not .aes or .aesbnk.");
    }
    status("Decode complete.");
  } catch (e) { status("ERROR: " + e.message); }
};
</script>
</body>
</html>
