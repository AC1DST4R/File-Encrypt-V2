<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AES File Encoder / Decoder</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #08090c;
    --panel: #101217;
    --panel-2: #151820;
    --border: #262a33;
    --border-hover: #3a404d;
    --text: #f2f4f7;
    --muted: #8e96a3;
    --accent: #ffffff;
    --accent-text: #090a0c;
    --track: #242832;
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;

    background:
      radial-gradient(
        circle at 50% -20%,
        #1b1f29 0,
        transparent 42%
      ),
      var(--bg);

    color: var(--text);

    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  button,
  input {
    font: inherit;
  }

  .app {
    width: min(760px, 100%);
  }

  .app > h1 {
    margin: 0;

    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.1;
    letter-spacing: -1.5px;
    font-weight: 750;
  }

  .sub {
    margin: 9px 0 28px;

    color: var(--muted);
    font-size: 15px;
  }

  .tabs {
    display: inline-flex;
    gap: 4px;

    padding: 4px;
    margin-bottom: 14px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: var(--panel);
  }

  button {
    border: 1px solid transparent;
    border-radius: 9px;

    padding: 10px 15px;

    background: transparent;
    color: var(--muted);

    cursor: pointer;

    transition:
      background .15s ease,
      color .15s ease,
      border-color .15s ease;
  }

  button:hover {
    color: var(--text);
    background: var(--panel-2);
  }

  button.active {
    background: #e9ebee;
    color: #0a0b0e;
  }

  .panel {
    padding: 20px;

    border: 1px solid var(--border);
    border-radius: 16px;

    background: rgba(16, 18, 23, .94);

    box-shadow:
      0 18px 50px rgba(0, 0, 0, .25);
  }

  .drop {
    display: block;

    padding: 30px 20px;
    margin-bottom: 12px;

    text-align: center;

    border: 1px dashed #343945;
    border-radius: 12px;

    background: #0d0f14;
    color: var(--text);

    cursor: pointer;

    transition:
      border-color .15s ease,
      background .15s ease;
  }

  .drop:hover {
    border-color: var(--border-hover);
    background: #12151b;
  }

  .drop strong {
    display: block;

    margin-bottom: 5px;

    font-size: 15px;
  }

  .drop small {
    color: var(--muted);
    font-size: 13px;
  }

  input[type="file"] {
    display: none;
  }

  .actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;

    margin-top: 16px;
  }

  .actions button {
    border-color: var(--border);

    background: var(--panel-2);
    color: var(--text);
  }

  .actions button:hover {
    border-color: var(--border-hover);
  }

  .actions .primary {
    border-color: transparent;

    background: var(--accent);
    color: var(--accent-text);

    font-weight: 650;
  }

  .actions .primary:hover {
    background: #dfe2e6;
  }

  .status {
    min-height: 52px;

    margin-top: 14px;
    padding: 14px 16px;

    display: flex;
    align-items: center;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: #0d0f13;
    color: #b5bcc7;

    font:
      13px/1.5
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      monospace;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .progress-wrap {
    margin-top: 10px;
    padding: 13px 15px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: #0d0f13;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;

    gap: 12px;

    margin-bottom: 9px;

    color: var(--muted);

    font:
      12px
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      monospace;
  }

  .progress-track {
    width: 100%;
    height: 8px;

    overflow: hidden;

    border-radius: 999px;

    background: var(--track);
  }

  .progress-bar {
    width: 0;
    height: 100%;

    border-radius: inherit;

    background: #e9ebee;

    transition: width .08s linear;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 560px) {
    body {
      padding: 28px 14px;
    }

    .panel {
      padding: 14px;
    }

    .drop {
      padding: 25px 14px;
    }

    .actions button {
      width: 100%;
    }
  }
</style>
</head>

<body>

<div class="app">

  <h1>AES File Encoder / Decoder</h1>

  <div class="sub">
    Custom <strong>.aes</strong> files and
    <strong>.aesbnk</strong> folder bundles
  </div>

  <div class="tabs">
    <button id="encTab" class="active">Encode</button>
    <button id="decTab">Decode</button>
  </div>

  <!-- ENCODE -->

  <section id="encodePanel" class="panel">

    <label class="drop" for="encodeFiles">
      <strong>Choose files</strong>
      <br>
      <small>You can select one or many files.</small>
    </label>

    <input
      id="encodeFiles"
      type="file"
      multiple
    >

    <label class="drop" for="encodeFolder">
      <strong>Choose an entire folder</strong>
      <br>
      <small>
        The folder's relative structure will be preserved
        in one .aesbnk.
      </small>
    </label>

    <input
      id="encodeFolder"
      type="file"
      webkitdirectory
      directory
      multiple
    >

    <div class="actions">

      <button
        class="primary"
        id="encodeBtn"
      >
        Encode selected files
      </button>

      <button id="folderBtn">
        Encode selected folder
      </button>

    </div>

  </section>

  <!-- DECODE -->

  <section id="decodePanel" class="panel hidden">

    <label class="drop" for="decodeFiles">
      <strong>Choose .aes or .aesbnk files</strong>
      <br>
      <small>
        .aes restores one file;
        .aesbnk restores all files in a bundle.
      </small>
    </label>

    <input
      id="decodeFiles"
      type="file"
      multiple
      accept=".aes,.aesbnk"
    >

    <div class="actions">

      <button
        class="primary"
        id="decodeBtn"
      >
        Decode
      </button>

    </div>

  </section>

  <!-- STATUS -->

  <div id="status" class="status">
    Ready.
  </div>

  <!-- PROGRESS -->

  <div id="progressWrap" class="progress-wrap hidden">

    <div class="progress-label">
      <span id="progressText">
        Preparing...
      </span>

      <span id="progressPercent">
        0%
      </span>
    </div>

    <div class="progress-track">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
"use strict";

/*
  ============================================================
  AES CUSTOM FILE FORMAT
  ============================================================

  Encoding:

      Original bytes
          ↓
      Caesar -8
          ↓
      Base64
          ↓
      Base16 / HEX
          ↓
      .aes

  Decoding performs the exact reverse.

  .aesbnk:

      JSON container containing multiple encoded files.

  Example:

  {
    "format": "AESBNK1",
    "version": 1,
    "files": [
      {
        "path": "folder/file.txt",
        "data": "..."
      }
    ]
  }
*/


/* ------------------------------------------------------------
   HELPERS
------------------------------------------------------------ */

const $ = id => document.getElementById(id);

function setStatus(message) {
  $("status").textContent = message;
}

function setProgress(percent, text) {
  percent = Math.max(0, Math.min(100, percent));

  $("progressWrap").classList.remove("hidden");

  $("progressBar").style.width = percent + "%";
  $("progressPercent").textContent =
    Math.round(percent) + "%";

  if (text) {
    $("progressText").textContent = text;
  }
}


/* ------------------------------------------------------------
   BASE64
------------------------------------------------------------ */

function bytesToBase64(bytes) {

  let binary = "";

  const CHUNK = 0x8000;

  for (
    let i = 0;
    i < bytes.length;
    i += CHUNK
  ) {

    binary += String.fromCharCode(
      ...bytes.subarray(i, i + CHUNK)
    );
  }

  return btoa(binary);
}


function base64ToBytes(str) {

  const binary = atob(str);

  const output =
    new Uint8Array(binary.length);

  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    output[i] =
      binary.charCodeAt(i);
  }

  return output;
}


/* ------------------------------------------------------------
   BASE16 / HEX
------------------------------------------------------------ */

function bytesToHex(bytes) {

  let output = "";

  for (const byte of bytes) {

    output +=
      byte.toString(16).padStart(2, "0");
  }

  return output.toUpperCase();
}


function hexToBytes(hex) {

  hex = hex.trim();

  if (hex.length % 2 !== 0) {
    throw new Error(
      "Invalid Base16: odd number of hex characters."
    );
  }

  if (!/^[0-9a-fA-F]*$/.test(hex)) {
    throw new Error(
      "Invalid Base16 data."
    );
  }

  const output =
    new Uint8Array(hex.length / 2);

  for (
    let i = 0;
    i < output.length;
    i++
  ) {

    output[i] =
      parseInt(
        hex.slice(i * 2, i * 2 + 2),
        16
      );
  }

  return output;
}


/* ------------------------------------------------------------
   CAESAR -8 / +8
------------------------------------------------------------ */

function caesarLeft8(bytes) {

  const output =
    new Uint8Array(bytes.length);

  for (
    let i = 0;
    i < bytes.length;
    i++
  ) {

    output[i] =
      (bytes[i] + 256 - 8) & 255;
  }

  return output;
}


function caesarRight8(bytes) {

  const output =
    new Uint8Array(bytes.length);

  for (
    let i = 0;
    i < bytes.length;
    i++
  ) {

    output[i] =
      (bytes[i] + 8) & 255;
  }

  return output;
}


/* ------------------------------------------------------------
   ENCODE / DECODE
------------------------------------------------------------ */

function encodeBytes(bytes) {

  // Caesar -8
  const shifted =
    caesarLeft8(bytes);

  // Base64
  const base64 =
    bytesToBase64(shifted);

  // Base16
  const base16 =
    new TextEncoder().encode(base64);

  return bytesToHex(base16);
}


function decodeBytes(hex) {

  // Base16 → Base64 text
  const base64Bytes =
    hexToBytes(hex);

  const base64 =
    new TextDecoder().decode(base64Bytes);

  // Base64 → bytes
  const shifted =
    base64ToBytes(base64);

  // Caesar +8
  return caesarRight8(shifted);
}


/* ------------------------------------------------------------
   SAFE PATHS
------------------------------------------------------------ */

function safeName(name) {

  return name
    .replace(
      /[<>:"/\\|?*\x00-\x1F]/g,
      "_"
    )
    .replace(
      /^\.+$/,
      "_"
    );
}


function normalizePath(path) {

  return path
    .replace(/\\/g, "/")
    .replace(/^\/+/, "")
    .split("/")
    .filter(
      part =>
        part &&
        part !== "." &&
        part !== ".."
    )
    .map(safeName)
    .join("/");
}


/* ------------------------------------------------------------
   DOWNLOAD
------------------------------------------------------------ */

async function downloadBlob(
  blob,
  filename,
  label = filename
) {

  setProgress(
    0,
    "Preparing " + label + "..."
  );

  /*
    Browser downloads do not expose
    reliable network/disk progress.

    This tracks preparation of the
    generated Blob instead.
  */

  const total =
    blob.size || 1;

  const CHUNK =
    1024 * 1024;

  for (
    let offset = 0;
    offset < total;
    offset += CHUNK
  ) {

    const processed =
      Math.min(
        offset + CHUNK,
        total
      );

    const percent =
      (processed / total) * 100;

    setProgress(
      percent,
      "Preparing " + label + "..."
    );

    await new Promise(
      requestAnimationFrame
    );
  }

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  setProgress(
    100,
    "Starting download..."
  );

  a.click();

  setProgress(
    100,
    "Download started: " + label
  );

  setTimeout(() => {

    URL.revokeObjectURL(url);

    a.remove();

  }, 1500);
}


/* ------------------------------------------------------------
   ENCODE SINGLE FILE
------------------------------------------------------------ */

async function encodeSingle(file) {

  setProgress(
    0,
    "Reading " + file.name + "..."
  );

  const bytes =
    new Uint8Array(
      await file.arrayBuffer()
    );

  setProgress(
    30,
    "Encoding " + file.name + "..."
  );

  /*
    Yield to the browser so the
    progress UI can update.
  */

  await new Promise(
    requestAnimationFrame
  );

  const hex =
    encodeBytes(bytes);

  setProgress(
    85,
    "Creating .aes file..."
  );

  await new Promise(
    requestAnimationFrame
  );

  const blob =
    new Blob(
      [hex],
      {
        type: "text/plain"
      }
    );

  await downloadBlob(
    blob,
    file.name + ".aes",
    file.name + ".aes"
  );
}


/* ------------------------------------------------------------
   ENCODE BUNDLE
------------------------------------------------------------ */

async function encodeBundle(files) {

  const entries = [];

  const total =
    files.length;

  for (
    let i = 0;
    i < total;
    i++
  ) {

    const file =
      files[i];

    const path =
      file.webkitRelativePath ||
      file.name;

    setProgress(
      (i / total) * 80,
      `Encoding ${i + 1}/${total}: ${path}`
    );

    await new Promise(
      requestAnimationFrame
    );

    const bytes =
      new Uint8Array(
        await file.arrayBuffer()
      );

    const encoded =
      encodeBytes(bytes);

    entries.push({
      path,
      data: encoded
    });

    setProgress(
      ((i + 1) / total) * 80,
      `Encoded ${i + 1}/${total} files`
    );
  }

  setProgress(
    85,
    "Building .aesbnk..."
  );

  const bundle = {

    format: "AESBNK1",

    version: 1,

    files: entries

  };

  const json =
    JSON.stringify(bundle);

  /*
    Folder name becomes the
    bundle filename.
  */

  const firstPath =
    files[0]?.webkitRelativePath ||
    files[0]?.name ||
    "folder";

  const base =
    firstPath
      .split("/")[0] ||
      "folder";

  const filename =
    safeName(base) +
    ".aesbnk";

  const blob =
    new Blob(
      [json],
      {
        type: "application/json"
      }
    );

  await downloadBlob(
    blob,
    filename,
    filename
  );
}


/* ------------------------------------------------------------
   DECODE SINGLE .AES
------------------------------------------------------------ */

async function decodeAES(file) {

  setProgress(
    10,
    "Reading " + file.name + "..."
  );

  const hex =
    await file.text();

  setProgress(
    40,
    "Decoding " + file.name + "..."
  );

  await new Promise(
    requestAnimationFrame
  );

  const bytes =
    decodeBytes(hex);

  setProgress(
    75,
    "Preparing restored file..."
  );

  /*
    Only remove the final .aes.
  */

  const originalName =
    file.name.replace(
      /\.aes$/i,
      ""
    );

  const blob =
    new Blob([bytes]);

  await downloadBlob(
    blob,
    originalName,
    originalName
  );
}


/* ------------------------------------------------------------
   DECODE .AESBNK
------------------------------------------------------------ */

async function decodeBundle(file) {

  setProgress(
    5,
    "Reading " + file.name + "..."
  );

  let bundle;

  try {

    bundle =
      JSON.parse(
        await file.text()
      );

  } catch {

    throw new Error(
      "The .aesbnk file contains invalid JSON."
    );
  }

  if (
    bundle.format !== "AESBNK1" ||
    !Array.isArray(bundle.files)
  ) {

    throw new Error(
      "Not a valid AESBNK1 bundle."
    );
  }

  const zip =
    new JSZip();

  const total =
    bundle.files.length;

  let decoded =
    0;

  for (
    let i = 0;
    i < total;
    i++
  ) {

    const entry =
      bundle.files[i];

    if (
      !entry ||
      typeof entry.path !== "string" ||
      typeof entry.data !== "string"
    ) {

      continue;
    }

    const path =
      normalizePath(
        entry.path
      );

    if (!path) {
      continue;
    }

    setProgress(
      total
        ? (i / total) * 75
        : 75,

      `Decoding ${i + 1}/${total}: ${entry.path}`
    );

    await new Promise(
      requestAnimationFrame
    );

    const bytes =
      decodeBytes(
        entry.data
      );

    zip.file(
      path,
      bytes
    );

    decoded++;
  }

  setProgress(
    80,
    `Decoded ${decoded}/${total} files`
  );

  setStatus(
    "Creating ZIP..."
  );

  const zipBlob =
    await zip.generateAsync(
      {
        type: "blob",

        compression: "DEFLATE",

        compressionOptions: {
          level: 6
        }
      },

      metadata => {

        const percent =
          Math.round(
            metadata.percent
          );

        setProgress(
          80 + percent * 0.2,
          `Creating ZIP... ${percent}%`
        );
      }
    );

  const zipName =
    file.name.replace(
      /\.aesbnk$/i,
      ""
    ) + ".zip";

  await downloadBlob(
    zipBlob,
    zipName,
    zipName
  );
}


/* ------------------------------------------------------------
   TABS
------------------------------------------------------------ */

$("encTab").onclick = () => {

  $("encTab")
    .classList
    .add("active");

  $("decTab")
    .classList
    .remove("active");

  $("encodePanel")
    .classList
    .remove("hidden");

  $("decodePanel")
    .classList
    .add("hidden");

  setStatus(
    "Ready to encode."
  );
};


$("decTab").onclick = () => {

  $("decTab")
    .classList
    .add("active");

  $("encTab")
    .classList
    .remove("active");

  $("decodePanel")
    .classList
    .remove("hidden");

  $("encodePanel")
    .classList
    .add("hidden");

  setStatus(
    "Ready to decode."
  );
};


/* ------------------------------------------------------------
   ENCODE BUTTON
------------------------------------------------------------ */

$("encodeBtn").onclick =
async () => {

  const files =
    [
      ...$("encodeFiles").files
    ];

  if (!files.length) {

    setStatus(
      "Select at least one file."
    );

    return;
  }

  try {

    if (files.length === 1) {

      setStatus(
        "Encoding " +
        files[0].name +
        "..."
      );

      await encodeSingle(
        files[0]
      );

      setStatus(
        "Done: " +
        files[0].name +
        ".aes"
      );

    } else {

      setStatus(
        "Encoding " +
        files.length +
        " files into an .aesbnk..."
      );

      await encodeBundle(
        files
      );

      setStatus(
        "Done: .aesbnk bundle created."
      );
    }

  } catch (error) {

    console.error(error);

    setStatus(
      "ERROR: " +
      error.message
    );
  }
};


/* ------------------------------------------------------------
   FOLDER BUTTON
------------------------------------------------------------ */

$("folderBtn").onclick =
async () => {

  const files =
    [
      ...$("encodeFolder").files
    ];

  if (!files.length) {

    setStatus(
      "Select a folder first."
    );

    return;
  }

  try {

    setStatus(
      "Encoding folder (" +
      files.length +
      " files)..."
    );

    await encodeBundle(
      files
    );

    setStatus(
      "Done: folder encoded as .aesbnk."
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "ERROR: " +
      error.message
    );
  }
};


/* ------------------------------------------------------------
   DECODE BUTTON
------------------------------------------------------------ */

$("decodeBtn").onclick =
async () => {

  const files =
    [
      ...$("decodeFiles").files
    ];

  if (!files.length) {

    setStatus(
      "Select .aes or .aesbnk files."
    );

    return;
  }

  try {

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const file =
        files[i];

      setStatus(
        `Decoding ${i + 1}/${files.length}: ${file.name}`
      );

      const name =
        file.name.toLowerCase();

      if (
        name.endsWith(".aesbnk")
      ) {

        await decodeBundle(
          file
        );

      } else if (
        name.endsWith(".aes")
      ) {

        await decodeAES(
          file
        );

      } else {

        throw new Error(
          file.name +
          " is not .aes or .aesbnk."
        );
      }
    }

    setProgress(
      100,
      "Decode complete."
    );

    setStatus(
      "Decode complete."
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "ERROR: " +
      error.message
    );
  }
};

</script>

</body>
</html>
